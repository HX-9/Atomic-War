<!-- ==========================================================================
   الحرب الذرية (Atomic War) - منصة أوراق البطاقات التكتيكية السفلية
   مسار الملف: modes/atomic-cards/cardsDock.html
   ملاحظة: يتم اختيار الطور الفرعي في صفحة التجهيز (#setupScreen) قبل المعركة ويُقفل أثناء اللعب
   ========================================================================== -->

<div id="neutronArsenalBar" class="neutron-floating-dock hidden">
    <!-- الشريط العلوي للمنصة: طاقة النيوترونات + الإرشاد التكتيكي -->
    <div class="dock-energy-bar">
        <div class="dock-neutron-info">
            <div class="dock-neutron-header">
                <span class="dock-neutron-label">
                    <i class="fa-solid fa-bolt icon-sky"></i> طاقة النيوترونات
                </span>
                <span id="neutronValueDisplay" class="dock-neutron-val">0 / 10</span>
            </div>
            <div class="neutron-meter-track" id="neutronMeterTrack">
                <!-- شرائح الطاقة النيوترونية -->
            </div>
        </div>
        <div id="arsenalHintText" class="dock-hint-text">
            💡 انقر على ذرتك لتغذيتها (1⚡) • أو اسحب بطاقة تكتيكية من يدك أدناه
        </div>
    </div>

    <!-- يد البطاقات التكتيكية الخمس (Sci-Fi Tactical Hand) -->
    <div class="tactical-cards-hand">
        <!-- بطاقة 1: ذرة أحادية -->
        <button type="button" class="arsenal-btn tactical-card tactical-card--element" data-action="atom" data-atoms="1" data-cost="3" id="btnArsenalSingle" title="إلقاء ذرة أحادية في غرفة فارغة">
            <div class="tactical-card-cost" id="costBadgeSingle">⚡ 3</div>
            <div class="tactical-card-visual">
                <span class="arsenal-atom-preview preview-1">●</span>
            </div>
            <div class="arsenal-btn-name">ذرة أحادية</div>
            <div class="tactical-card-type">توسع • فراغ</div>
        </button>

        <!-- بطاقة 2: ذرة ثنائية -->
        <button type="button" class="arsenal-btn tactical-card tactical-card--element" data-action="atom" data-atoms="2" data-cost="6" id="btnArsenalDouble" title="إلقاء ذرة ثنائية في غرفة فارغة">
            <div class="tactical-card-cost" id="costBadgeDouble">⚡ 6</div>
            <div class="tactical-card-visual">
                <span class="arsenal-atom-preview preview-2">●●</span>
            </div>
            <div class="arsenal-btn-name">ثنائي النظائر</div>
            <div class="tactical-card-type">شحن • فراغ</div>
        </button>

        <!-- بطاقة 3: ذرة ثلاثية -->
        <button type="button" class="arsenal-btn tactical-card tactical-card--element" data-action="atom" data-atoms="3" data-cost="9" id="btnArsenalTriple" title="إلقاء نواة ثلاثية مقاومة في غرفة فارغة">
            <div class="tactical-card-cost" id="costBadgeTriple">⚡ 9</div>
            <div class="tactical-card-visual">
                <span class="arsenal-atom-preview preview-3">●●●</span>
            </div>
            <div class="arsenal-btn-name">النواة الثلاثية</div>
            <div class="tactical-card-type">قلعة • فراغ</div>
        </button>

        <!-- بطاقة 4: درع نووي واقٍ -->
        <button type="button" class="arsenal-btn arsenal-btn--control-rod tactical-card tactical-card--defense" data-action="controlRod" data-cost="5" id="btnArsenalControlRod" title="تثبيت درع نووي واقٍ على إحدى غرفك لامتصاص الانفجارات">
            <div class="tactical-card-cost arsenal-btn-cost--rod" id="costBadgeControlRod">🛡️ 5</div>
            <div class="tactical-card-visual">
                <i class="fa-solid fa-shield-halved arsenal-rod-icon"></i>
            </div>
            <div class="arsenal-btn-name">درع التحكم</div>
            <div class="tactical-card-type">تحصين غرفتك</div>
        </button>

        <!-- بطاقة 5: إخماد طاقة -->
        <button type="button" class="arsenal-btn arsenal-btn--energy-drain tactical-card tactical-card--offense" data-action="energyDrain" data-cost="3" id="btnArsenalEnergyDrain" title="إلقاء هجوم إخماد طاقة على ذرة معادية لإرجاعها للمستوى الأول">
            <div class="tactical-card-cost arsenal-btn-cost--drain" id="costBadgeEnergyDrain">⚡ 3</div>
            <div class="tactical-card-visual">
                <i class="fa-solid fa-bolt-slash arsenal-drain-icon"></i>
            </div>
            <div class="arsenal-btn-name">إخماد طاقة</div>
            <div class="tactical-card-type">إضعاف العدو</div>
        </button>
    </div>
</div>
